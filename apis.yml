aid: entire
name: Entire
description: >-
  Entire is a developer platform built for both humans and AI agents, founded by
  former GitHub CEO Thomas Dohmke and launched with a $60M seed round. It pairs fast,
  distributed, Git-compatible hosting with agent session management: the Entire CLI
  hooks into your Git workflow and captures every coding-agent session — prompts, tool
  calls, and decisions — as Checkpoints indexed alongside commits, creating a searchable
  record of how code was written. Features include session-to-commit pairing, secret
  detection and user-defined redaction, multi-agent parallel review, cross-agent work
  resumption, and a distributed Git mirroring network for fast, rate-limit-free clones.
